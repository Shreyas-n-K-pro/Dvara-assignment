  /api/ledger/trial-balance:
    get:
      tags: [Ledger]
      summary: Verify double-entry global trial balance
      description: |
        Asserts system-wide double-entry equilibrium $\sum \text{Debit} \equiv \sum \text{Credit}$.
        **Permitted Roles:** `MANAGER`, `AUDITOR`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System trial balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/TrialBalance'
        '403':
          description: Forbidden for LOAN_OFFICER role

  /api/ledger/transactions/{id}:
    get:
      tags: [Ledger]
      summary: Get ledger transaction entries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
        '404':
          description: Transaction not found

  /api/ledger/transactions/{id}/reverse:
    post:
      tags: [Ledger]
      summary: Reverse posted transaction with compensating contra entries
      description: |
        Creates an equal-and-opposite contra transaction. Never mutates or deletes posted entries.
        **Permitted Roles:** `MANAGER` only (LOAN_OFFICER and AUDITOR forbidden).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Reversal due to duplicate bank processing error"
      responses:
        '200':
          description: Transaction reversed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      originalTransactionId: { type: string, format: uuid }
                      reversalTransaction: { type: object }
        '400':
          description: Transaction is already reversed
        '403':
          description: Forbidden for non-MANAGER roles
        '404':
          description: Transaction not found

  /api/accruals/overdue:
    post:
      tags: [Accruals]
      summary: Protected manual trigger for overdue interest & penalty accrual
      description: |
        Calculates and posts daily interest and penalties on overdue installments using the ACTUAL/365 convention with database-level uniqueness.
        **Permitted Roles:** `MANAGER` only.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                asOfDate:
                  type: string
                  format: date
                  example: "2026-06-01"
      responses:
        '200':
          description: Overdue accruals processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      asOfDate: { type: string, format: date }
                      processedLoans: { type: integer, example: 45 }
                      totalAccruals: { type: integer, example: 78 }
                      totalInterestPaise: { type: string, example: "128450" }
                      totalPenaltyPaise: { type: string, example: "64220" }
        '403':
          description: Forbidden for non-MANAGER roles

