            type: string
            format: uuid
      responses:
        '200':
          description: Repayment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      repayment:
                        $ref: '#/components/schemas/Repayment'
