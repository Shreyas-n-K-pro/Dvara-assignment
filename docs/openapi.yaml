                        type: array
                        items:
                          $ref: '#/components/schemas/RepaymentAllocation'
        '404':
          description: Repayment not found

  /api/ledger/accounts:
    get:
      tags: [Ledger]
      summary: List chart of ledger accounts and balances
      description: |
        Retrieves active ledger accounts and derived balances.
        **Permitted Roles:** `MANAGER`, `AUDITOR` (LOAN_OFFICER forbidden).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of ledger accounts
