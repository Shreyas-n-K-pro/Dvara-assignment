services:
  mysql:
    image: mysql:8.0
    container_name: dvara-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dvara_root_pass
      MYSQL_DATABASE: dvara_loan_db
      MYSQL_USER: dvara_user
      MYSQL_PASSWORD: dvara_pass_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local
